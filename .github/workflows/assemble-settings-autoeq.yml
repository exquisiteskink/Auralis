name: assemble-settings-autoeq
on:
  workflow_dispatch:
  push:
    branches: [feature/autoeq-presets]
    paths:
      - 'staging/settings-autoeq/**'
      - '.github/workflows/assemble-settings-autoeq.yml'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/autoeq-presets
      - name: Apply AutoEq SettingsScreen patch
        run: |
          patch -p1 < staging/settings-autoeq/SettingsScreen.autoeq.patch
          grep -q AutoEqCatalog app/src/main/java/app/auralis/music/ui/settings/SettingsScreen.kt
          grep -q autoeqPresetId app/src/main/java/app/auralis/music/ui/settings/SettingsScreen.kt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/auralis/music/ui/settings/SettingsScreen.kt
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "AutoEq: SettingsScreen Headphone EQ search UI"
            git push origin HEAD:feature/autoeq-presets
          fi
