name: assemble-settings-autoeq
on:
  workflow_dispatch:
  push:
    branches: [feature/autoeq-presets]
    paths:
      - 'staging/settings-autoeq/**'
      - '.github/workflows/assemble-settings-autoeq.yml'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/autoeq-presets
      - name: Decode and apply SettingsScreen patch
        run: |
          set -euo pipefail
          cat staging/settings-autoeq/pb0.txt staging/settings-autoeq/pb1.txt staging/settings-autoeq/pb2.txt staging/settings-autoeq/pb3.txt | base64 -d > /tmp/SettingsScreen.autoeq.patch
          md5sum /tmp/SettingsScreen.autoeq.patch
          test "$(md5sum /tmp/SettingsScreen.autoeq.patch | awk '{print $1}')" = "044b5c1ce33795982f7a19ba745c5e83"
          patch -p1 --forward < /tmp/SettingsScreen.autoeq.patch
          test "$(md5sum app/src/main/java/app/auralis/music/ui/settings/SettingsScreen.kt | awk '{print $1}')" = "17ddc88e0010d83da325765cc84edda4"
          grep -q AutoEqCatalog app/src/main/java/app/auralis/music/ui/settings/SettingsScreen.kt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/auralis/music/ui/settings/SettingsScreen.kt
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "AutoEq: SettingsScreen Headphone EQ search UI"
            git push origin HEAD:feature/autoeq-presets
          fi
