name: apply-dvc-playback
on:
  push:
    paths:
      - 'staging/dvc/PlaybackService.kt.gz.b64'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Decode PlaybackService
        run: |
          python3 - <<'PY'
          import gzip, base64
          from pathlib import Path
          b64 = Path('staging/dvc/PlaybackService.kt.gz.b64').read_text().strip()
          data = gzip.decompress(base64.b64decode(b64))
          out = Path('app/src/main/java/app/auralis/music/data/player/PlaybackService.kt')
          out.write_bytes(data)
          print('wrote', out, 'bytes', len(data))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/auralis/music/data/player/PlaybackService.kt
          git diff --cached --quiet || git commit -m "fix(playback): apply Poweramp DVC skip-volume PlaybackService"
          git push
