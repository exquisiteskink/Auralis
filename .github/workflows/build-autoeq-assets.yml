name: build-autoeq-assets
on:
  workflow_dispatch:
  push:
    branches: [feature/autoeq-presets]
    paths:
      - '.github/workflows/build-autoeq-assets.yml'
      - 'scripts/generate_autoeq_bundle.py'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/autoeq-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sparse-clone AutoEq results
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/jaakkopasanen/AutoEq.git /tmp/AutoEq
          cd /tmp/AutoEq
          git sparse-checkout set results
          git checkout
          echo "AutoEq HEAD $(git rev-parse HEAD)"
      - name: Generate gzip bundle and b64 parts
        run: |
          python3 scripts/generate_autoeq_bundle.py \
            --autoeq-root /tmp/AutoEq \
            --out /tmp/presets.json.gz \
            --mode dedupe
          python3 <<'PY'
          from pathlib import Path
          import base64
          raw = Path('/tmp/presets.json.gz').read_bytes()
          b64 = base64.b64encode(raw).decode('ascii')
          out = Path('app/src/main/assets/autoeq/b64')
          out.mkdir(parents=True, exist_ok=True)
          # remove old parts
          for p in out.glob('part*.txt'):
              p.unlink()
          size = 12000
          n = 0
          for start in range(0, len(b64), size):
              (out / f'part{n:02d}.txt').write_text(b64[start:start+size], encoding='ascii')
              n += 1
          print('wrote', n, 'parts, b64_len', len(b64), 'gzip', len(raw))
          # update PART_COUNT in AutoEqCatalog.kt
          cat = Path('app/src/main/java/app/auralis/music/data/eq/autoeq/AutoEqCatalog.kt')
          text = cat.read_text()
          import re
          text2, cnt = re.subn(r'private const val PART_COUNT = \d+', f'private const val PART_COUNT = {n}', text, count=1)
          assert cnt == 1, cnt
          cat.write_text(text2)
          print('PART_COUNT ->', n)
          PY
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/autoeq/b64/ \
                  app/src/main/java/app/auralis/music/data/eq/autoeq/AutoEqCatalog.kt
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "AutoEq: regenerate b64 preset parts from AutoEq (dedupe)"
            git push origin HEAD:feature/autoeq-presets
          fi
